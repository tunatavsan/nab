name: Bug report
description: Something in Nab does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If the problem could expose a library, a chat or an API key, please
        report it privately as described in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Screenshots help; please hide API keys and private chats.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the video link if the problem is specific to one video.
      placeholder: |
        1. Open https://www.youtube.com/watch?v=… in Safari
        2. Press ⌃⌥N
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capturing a tab (shortcut or browser)
        - Transcript or chapters
        - Context pack or export
        - Chat or summary
        - AI provider setup
        - Library or reader
        - Menu bar panel
        - Command line or nab:// URLs
        - Something else
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider and model
      description: Only if the problem involves the chat.
      placeholder: Claude Code, claude-opus-5-5
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Safari 26.1
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1 (25B78)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nab version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
